<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>30-Day Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0A0A0F;color:#F1F0EE;overscroll-behavior:none;min-height:100vh}
:root{--bg:#0A0A0F;--surface:#12121A;--card:#1A1A26;--border:#2A2A3E;--faint:#3A3A52;--accent:#F59E0B;--blue:#60A5FA;--green:#34D399;--purple:#A78BFA;--red:#F87171;--orange:#F97316;--text:#F1F0EE;--muted:#7A7A9A}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px}
.top-bar{padding:16px 16px 0;position:sticky;top:0;z-index:10;background:var(--bg)}
.day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;padding:8px 12px;border-radius:12px;border:1.5px solid var(--border);background:transparent;cursor:pointer;text-align:center;min-width:52px;transition:all .2s;font-family:inherit}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .3s}
.ex-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.ex-body{border-top:1px solid var(--border);padding:14px 16px}
.set-bubble{width:36px;height:36px;border-radius:50%;border:2px solid var(--faint);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;font-family:inherit}
.set-bubble.done{border:none;background:var(--accent);color:#000;transform:scale(1.1)}
.accordion{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.accordion-head{width:100%;padding:13px 16px;background:none;border:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--text);font-family:inherit}
.accordion-inner{border-top:1px solid var(--border);padding:10px 16px 14px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(18,18,26,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:10px 12px 20px;z-index:100}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit}
.add-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:199;display:none}
.add-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border);z-index:200;display:none;max-height:92vh;overflow-y:auto;padding-bottom:28px}
.form-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--accent)}
.stepper{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;height:46px}
.step-b{width:44px;height:100%;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.step-b:active{background:var(--faint)}
.step-v{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--text)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn{padding:10px 8px;border-radius:12px;border:1.5px solid var(--border);background:transparent;cursor:pointer;text-align:center;font-family:inherit;transition:all .15s;color:var(--text)}
.cat-btn.sel{border-color:var(--accent);background:rgba(245,158,11,.12)}
.chevron{color:var(--muted);font-size:16px;transition:transform .2s;display:inline-block;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.ring-wrap{position:relative;flex-shrink:0}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.step-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--faint);align-items:flex-start}
.step-row:last-child{border-bottom:none}
.step-num{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
/* Chat / Coach */
@keyframes tdot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);animation:tdot 1.4s infinite ease-in-out}
.tdot:nth-child(2){animation-delay:.16s}.tdot:nth-child(3){animation-delay:.32s}
button:active{opacity:.8}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-bar">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><div style="font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em">30-DAY BLUEPRINT</div><div style="font-size:22px;font-weight:800">Workout Tracker</div></div>
      <div id="dayBadge"></div>
    </div>
    <div class="day-strip" id="dayStrip"></div>
  </div>
  <div id="mainContent" style="padding:8px 16px 0"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div class="add-overlay" id="addOverlay" onclick="closeAddSheet()"></div>
<div class="add-sheet" id="addSheet">
  <div style="display:flex;justify-content:center;padding:12px 0 6px"><div style="width:36px;height:4px;border-radius:99px;background:var(--faint)"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px 16px">
    <div style="font-size:18px;font-weight:800">Add Custom Exercise</div>
    <button onclick="closeAddSheet()" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1">×</button>
  </div>
  <div style="padding:0 16px">
    <div style="margin-bottom:16px"><label class="form-label" for="exNameInput">EXERCISE NAME *</label><input class="form-input" id="exNameInput" type="text" inputmode="text" autocomplete="off" placeholder="e.g. Cable Crunch, Box Jump"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><div class="form-label">SETS</div><div class="stepper"><button class="step-b" onclick="adjSets(-1)">−</button><div class="step-v" id="setsVal">3</div><button class="step-b" onclick="adjSets(1)">+</button></div></div>
      <div><div class="form-label">REPS (0=TIMED)</div><div class="stepper"><button class="step-b" onclick="adjReps(-1)">−</button><div class="step-v" id="repsVal">10</div><button class="step-b" onclick="adjReps(1)">+</button></div></div>
    </div>
    <div style="margin-bottom:16px">
      <div class="form-label">CATEGORY (CALORIE ESTIMATE)</div>
      <div class="cat-grid">
        <button class="cat-btn" data-cat="heavy" onclick="selCat('heavy')"><div style="font-size:18px;margin-bottom:3px">🏋️</div><div style="font-size:11px;font-weight:700">Heavy Compound</div><div style="font-size:10px;color:var(--muted)">~13 kcal/set</div></button>
        <button class="cat-btn sel" data-cat="compound" onclick="selCat('compound')"><div style="font-size:18px;margin-bottom:3px">💪</div><div style="font-size:11px;font-weight:700">Compound</div><div style="font-size:10px;color:var(--muted)">~10 kcal/set</div></button>
        <button class="cat-btn" data-cat="isolation" onclick="selCat('isolation')"><div style="font-size:18px;margin-bottom:3px">🦾</div><div style="font-size:11px;font-weight:700">Isolation</div><div style="font-size:10px;color:var(--muted)">~6 kcal/set</div></button>
        <button class="cat-btn" data-cat="core" onclick="selCat('core')"><div style="font-size:18px;margin-bottom:3px">🧘</div><div style="font-size:11px;font-weight:700">Core / Mobility</div><div style="font-size:10px;color:var(--muted)">~5 kcal/set</div></button>
      </div>
    </div>
    <div style="margin-bottom:16px"><label class="form-label" for="exNoteInput">FORM NOTE (OPTIONAL)</label><input class="form-input" id="exNoteInput" type="text" inputmode="text" autocomplete="off" placeholder="e.g. RPE 8, slow eccentric"></div>
    <div style="margin-bottom:20px"><label class="form-label" for="exYtInput">YOUTUBE SEARCH (OPTIONAL)</label><input class="form-input" id="exYtInput" type="text" inputmode="text" autocomplete="off" placeholder="Leave blank to use exercise name"></div>
    <button onclick="submitNewEx()" style="width:100%;padding:15px;border-radius:14px;border:none;background:var(--accent);color:#000;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit">+ Add to Workout</button>
  </div>
</div>

<script>
// ─── Palette / Types ──────────────────────────────────────────────────────────
const C={blue:"#60A5FA",purple:"#A78BFA",green:"#34D399",accent:"#F59E0B",orange:"#F97316"};
const TYPE={push:{color:C.blue,emoji:"💪",label:"Push"},pull:{color:C.purple,emoji:"🔙",label:"Pull"},legs:{color:C.green,emoji:"🦵",label:"Legs+Core"},recovery:{color:C.accent,emoji:"🌿",label:"Recovery"}};
const CAL_CAT={heavy:13,compound:10,isolation:6,core:5,cardio:40};
// *** VERCEL: change this to "/api/chat" ***
const API_URL = "/api/chat";
function ytHref(q){return"https://www.youtube.com/results?search_query="+encodeURIComponent(q+" form tutorial")}

const DAYS=[
  {id:0,day:"Mon",label:"Push A",type:"push",focus:"Chest Dominant",exercises:[

  ]},

    {id:"pua1",name:"Barbell Bent-Over Row",sets:4,reps:9,cal:12,note:"Chest tall throughout",yt:"barbell bent over row form",posture:false},

    {id:"pua3",name:"Single-Arm DB Row",sets:3,reps:10,cal:9,note:"Per side",yt:"single arm dumbbell row form",posture:false},
    {id:"pua4",name:"Lat Pulldown",sets:3,reps:11,cal:8,note:"",yt:"lat pulldown form tutorial",posture:false},

    {id:"pua6",name:"★ Prone Y-T-W Raises",sets:3,reps:10,cal:3,note:"Each position, no weight",yt:"prone YTW exercise scapular",posture:true},
    {id:"pua7",name:"Rear Delt Fly (Machine)",sets:3,reps:15,cal:5,note:"",yt:"rear delt fly machine form",posture:false},
    {id:"pua8",name:"Hammer Curls",sets:3,reps:12,cal:5,note:"",yt:"hammer curl form tutorial",posture:false}
  ]},
  {id:2,day:"Wed",label:"Legs A",type:"legs",focus:"Quad & Glute + Core",exercises:[
    {id:"la1",name:"Barbell Back Squat",sets:4,reps:8,cal:15,note:"Full depth, heels elevated if needed",yt:"barbell squat full depth form",posture:false},
    {id:"la2",name:"Romanian Deadlift",sets:4,reps:10,cal:12,note:"Hip hinge, flat back — no rounding",yt:"romanian deadlift form tutorial",posture:false},
    {id:"la3",name:"Leg Press",sets:3,reps:12,cal:10,note:"High foot placement for glute emphasis",yt:"leg press form glutes tutorial",posture:false},
    {id:"la4",name:"Bulgarian Split Squat",sets:3,reps:10,cal:12,note:"Per leg, rear foot elevated",yt:"bulgarian split squat form tutorial",posture:false},

    {id:"la6",name:"Standing Calf Raise",sets:4,reps:15,cal:5,note:"",yt:"standing calf raise form",posture:false},
    {id:"la7",name:"♦ Dead Bug",sets:3,reps:10,cal:4,note:"TA activation — exhale fully to flatten back",yt:"dead bug exercise transverse abdominis",posture:true},
    {id:"la8",name:"♦ Bird Dog",sets:3,reps:10,cal:4,note:"Per side, slow and controlled",yt:"bird dog exercise form tutorial",posture:true},
    {id:"la9",name:"Pallof Press",sets:3,reps:12,cal:5,note:"Per side — anti-rotation core",yt:"pallof press anti rotation core",posture:false},
    {id:"la10",name:"Plank (Hollow Body)",sets:3,reps:null,cal:5,note:"45 sec — posterior pelvic tilt cue",yt:"hollow body plank tutorial",posture:false}
  ]},
  {id:3,day:"Thu",label:"Push B",type:"push",focus:"Shoulder Dominant",exercises:[
    {id:"pb1",name:"Seated DB Shoulder Press",sets:4,reps:10,cal:10,note:"",yt:"seated dumbbell shoulder press form",posture:false},
    {id:"pb2",name:"Lateral Raises",sets:4,reps:15,cal:5,note:"4 sets — lagging muscle priority",yt:"lateral raises hypertrophy",posture:false},
    {id:"pb3",name:"Arnold Press",sets:3,reps:12,cal:9,note:"",yt:"arnold press form tutorial",posture:false},
    {id:"pb4",name:"Cable Crossover (Low-High)",sets:3,reps:15,cal:6,note:"Upper chest emphasis",yt:"cable crossover low to high chest",posture:false},
    {id:"pb5",name:"OHT Tricep Extension",sets:3,reps:12,cal:6,note:"",yt:"overhead tricep extension form",posture:false},
    {id:"pb6",name:"EZ-Bar Skull Crushers",sets:3,reps:10,cal:6,note:"",yt:"EZ bar skull crushers form",posture:false},
    {id:"pb7",name:"★ Band Pull-Apart",sets:3,reps:20,cal:4,note:"Mandatory posture finisher",yt:"band pull apart exercise tutorial",posture:true}
  ]},
  {id:4,day:"Fri",label:"Pull B",type:"pull",focus:"Vertical Pull & Traps",exercises:[
    {id:"pb81",name:"Weighted Pull-Ups",sets:4,reps:7,cal:13,note:"Or lat pulldown if needed",yt:"weighted pull ups form tutorial",posture:false},

    {id:"pb84",name:"★ Face Pull",sets:3,reps:15,cal:4,note:"Every pull day — always",yt:"cable face pull form tutorial",posture:true},
    {id:"pb85",name:"DB Shrugs",sets:3,reps:15,cal:6,note:"2 sec pause at top",yt:"dumbbell shrugs form tutorial",posture:false},
    {id:"pb86",name:"★ Prone Lower Trap Raise",sets:3,reps:10,cal:3,note:"Y-shape arms, no weight",yt:"prone lower trap raise tutorial",posture:true},
    {id:"pb87",name:"Zottman Curls",sets:3,reps:10,cal:5,note:"Supination + pronation",yt:"zottman curl tutorial",posture:false}
  ]},
  {id:5,day:"Sat",label:"Legs B",type:"legs",focus:"Posterior Chain + Core",exercises:[
    {id:"lb1",name:"♦ Barbell Hip Thrust",sets:4,reps:10,cal:13,note:"KEY APT fix — full hip extension, neutral pelvis",yt:"barbell hip thrust APT glute activation",posture:true},

    {id:"lb3",name:"Conventional Deadlift",sets:3,reps:6,cal:15,note:"Add in Wks 3–4 intensification only",yt:"conventional deadlift form tutorial",posture:false},
    {id:"lb4",name:"Walking Lunges",sets:3,reps:12,cal:12,note:"Per leg",yt:"walking lunges form tutorial",posture:false},
    {id:"lb5",name:"Lying Leg Curl",sets:4,reps:10,cal:6,note:"",yt:"lying leg curl hamstrings",posture:false},
    {id:"lb6",name:"Leg Extension",sets:3,reps:12,cal:6,note:"",yt:"leg extension machine form",posture:false},
    {id:"lb7",name:"Ab Wheel Rollout",sets:3,reps:9,cal:7,note:"",yt:"ab wheel rollout form tutorial",posture:false},
    {id:"lb8",name:"Copenhagen Plank",sets:3,reps:null,cal:5,note:"20 sec/side",yt:"copenhagen plank adductor",posture:false},
    {id:"lb9",name:"Side Plank",sets:3,reps:null,cal:4,note:"30 sec/side",yt:"side plank form tutorial",posture:false},
    {id:"lb10",name:"Landmine Rotation",sets:3,reps:10,cal:7,note:"Per side",yt:"landmine rotation core",posture:false}
  ]},
  {id:6,day:"Sun",label:"Recovery",type:"recovery",focus:"Mobility & Flexibility",exercises:[
    {id:"rec1",name:"Light Walk / Yoga Flow",sets:1,reps:null,cal:20,note:"20–30 min easy movement",yt:"morning yoga flow stretching",posture:false},
    {id:"rec2",name:"Couch Stretch",sets:2,reps:null,cal:3,note:"90 sec/side — most important APT release",yt:"couch stretch hip flexor APT release",posture:true},
    {id:"rec3",name:"Pigeon Pose",sets:1,reps:null,cal:3,note:"90 sec/side",yt:"pigeon pose hip flexor tutorial",posture:false},
    {id:"rec4",name:"Supine Hamstring Stretch",sets:1,reps:null,cal:2,note:"60 sec/side",yt:"supine hamstring stretch tutorial",posture:false},
    {id:"rec5",name:"Thoracic Foam Roll",sets:1,reps:null,cal:3,note:"Segment T1–T12",yt:"thoracic foam roll tutorial",posture:true},
    {id:"rec6",name:"World's Greatest Stretch",sets:1,reps:null,cal:2,note:"5 reps/side",yt:"world greatest stretch mobility",posture:false},
    {id:"rec7",name:"90/90 Hip Stretch",sets:2,reps:null,cal:2,note:"60 sec/side",yt:"90 90 hip stretch mobility tutorial",posture:true}
  ]}
];

const WARMUP=["Hip circles — 10 each direction","Leg swings (fwd/lateral) — 10/side","Arm circles + cross-body — 10 each","Thoracic rotation — 8/side","Cat-cow — 10 slow reps","World's greatest stretch — 5/side","Glute bridge activation — 15 reps","Band pull-apart — 15 reps"];
const COOLDOWN=["Hip flexor stretch (half-kneeling) — 60s/side","Supine hamstring stretch — 60s/side","Pigeon pose — 90s/side","Doorway chest stretch — 60s","Child's pose — 60s","Foam roller thoracic extension — 60s","Supine spinal twist — 60s/side"];

// ─── State ────────────────────────────────────────────────────────────────────
const jsDay=new Date().getDay(),todayIdx=jsDay===0?6:jsDay-1;
let selectedDay=todayIdx,activeTab="today",openEx={},showWarmup=false,showCooldown=false;
let newExSets=3,newExReps=10,newExCat="compound";
// Progress + custom exercises: use localStorage on Vercel
let progressData=JSON.parse(localStorage.getItem("wt_progress")||"{}");
let customExercises=JSON.parse(localStorage.getItem("wt_custom")||"{}");
// Coach
let chatMsgs=[],chatBusy=false;

function saveLS(){localStorage.setItem("wt_progress",JSON.stringify(progressData));localStorage.setItem("wt_custom",JSON.stringify(customExercises));}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function getCalBurned(dayId){const day=DAYS[dayId];if(!day)return 0;const dp=progressData[dayId]||{};return[...day.exercises,...(customExercises[dayId]||[])].reduce((s,e)=>s+((dp[e.id]?.sets||[]).filter(Boolean).length)*(e.cal||7),0)}
function getMaxCal(dayId){const day=DAYS[dayId];if(!day)return 0;return[...day.exercises,...(customExercises[dayId]||[])].reduce((s,e)=>s+e.sets*(e.cal||7),0)}
function getWeekCal(){return DAYS.reduce((s,d)=>s+getCalBurned(d.id),0)}
function getDayProg(dayId){
  const day=DAYS[dayId];if(!day)return{done:0,total:0,pct:0};
  const allEx=[...day.exercises,...(customExercises[dayId]||[])];
  const dp=progressData[dayId]||{};
  const total=allEx.reduce((s,e)=>s+e.sets,0);
  const done=allEx.reduce((s,e)=>s+((dp[e.id]?.sets||[]).filter(Boolean).length),0);
  return{done,total,pct:total>0?Math.round((done/total)*100):0};
}
function ring(pct,size,stroke,color){
  const r=(size-stroke)/2,c=2*Math.PI*r,d=(pct/100)*c;
  return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#3A3A52" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${d} ${c}" stroke-linecap="round"/></svg>`;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function toggleSet(dayId,exId,idx,totalSets){
  if(!progressData[dayId])progressData[dayId]={};
  if(!progressData[dayId][exId])progressData[dayId][exId]={sets:Array(totalSets).fill(false),weight:0};

async function sendChat(txt){
  if(chatBusy||!txt.trim())return;

  chatBusy=true;render();
  const day=DAYS[selectedDay],{done,total,pct}=getDayProg(selectedDay);
  const sys=`You are an expert personal fitness coach embedded in a workout tracking app. Keep responses to 2-3 short paragraphs. Be direct, practical, and specific.

USER PROFILE:
- 28M, 5'4" (163cm), 64kg, 13.1% body fat, 52kg lean mass

CURRENT SESSION:

When giving form tips, use 2-3 specific cues. When giving nutrition advice, respect the acid reflux constraints. If asked about substitutions, suggest 1-2 practical gym alternatives.`;
  try{
    const resp=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model: "claude-haiku-4-5-20251001",max_tokens:600,system:sys,messages:chatMsgs})});
    const data=await resp.json();
    const reply=data.content?.[0]?.text||"Couldn't get a response — try again.";
    chatMsgs.push({role:"assistant",content:reply});
  }catch(e){

  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}),120);

    chatMsgs.forEach(m=>{
      const isUser=m.role==="user";
      h+=`<div style="display:flex;${isUser?"justify-content:flex-end":"justify-content:flex-start"};margin-bottom:12px;gap:8px;align-items:flex-end">
        ${!isUser?`<div style="width:28px;height:28px;border-radius:50%;background:rgba(167,139,250,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;margin-bottom:2px">🤖</div>`:""}
        <div style="max-width:80%;background:${isUser?"rgba(245,158,11,.18)":"var(--card)"};border:1px solid ${isUser?"rgba(245,158,11,.3)":"var(--border)"};border-radius:${isUser?"16px 4px 16px 16px":"4px 16px 16px 16px"};padding:11px 14px;font-size:13px;color:var(--text);line-height:1.65">${m.content.replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>")}</div>
        ${isUser?`<div style="width:28px;height:28px;border-radius:50%;background:rgba(245,158,11,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;margin-bottom:2px">🏋️</div>`:""}
      </div>`;
    });
    if(chatBusy){
      h+=`<div style="display:flex;justify-content:flex-start;gap:8px;align-items:flex-end;margin-bottom:12px">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(167,139,250,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px">🤖</div>
        <div style="background:var(--card);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:14px 16px;display:flex;gap:5px;align-items:center">
          <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
        </div>
      </div>`;
    }
    h+=`</div><button onclick="clearChat()" style="width:100%;padding:9px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:12px">Clear conversation</button>`;
  }
  h+=`<div style="display:flex;gap:8px">
    <input id="ci" type="text" placeholder="Ask your coach..." onkeypress="if(event.key==='Enter')sendChatInput()" style="flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none" onfocus="this.style.borderColor='var(--purple)'" onblur="this.style.borderColor='var(--border)'">
    <button onclick="sendChatInput()" ${chatBusy?"disabled":""} style="width:46px;height:46px;border-radius:12px;border:none;background:${chatBusy?"var(--faint)":"var(--purple)"};color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:background .2s">↑</button>
  </div></div>`;
  return h;
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render(){
  const day=DAYS[selectedDay],meta=TYPE[day.type];
  const badge=document.getElementById("dayBadge");
  badge.style.cssText=`background:${meta.color}22;border:1px solid ${meta.color}44;border-radius:12px;padding:6px 12px;text-align:center`;
  badge.innerHTML=`<div style="font-size:18px">${meta.emoji}</div><div style="font-size:9px;color:${meta.color};font-weight:700;margin-top:1px">${day.day.toUpperCase()}</div>`;

  document.getElementById("dayStrip").innerHTML=DAYS.map(d=>{
    const m=TYPE[d.type],isSel=d.id===selectedDay,isTdy=d.id===todayIdx;
    return`<button class="day-btn" onclick="selectDay(${d.id})" style="border-color:${isSel?m.color:isTdy?m.color+"44":"var(--border)"};background:${isSel?m.color+"22":"transparent"}">
      <div style="font-size:10px;font-weight:700;color:${isSel?m.color:isTdy?m.color:"var(--muted)"}">${d.day}</div>
      <div style="font-size:8px;color:${isSel?m.color:"var(--faint)"};margin-top:2px;font-weight:600">${d.label}</div>
    </button>`;}).join("");

  const mc=document.getElementById("mainContent");
  const pad=activeTab==="today"?"8px 16px 0":"8px 0 0";
  mc.style.padding=pad;
  if(activeTab==="today")mc.innerHTML=renderWorkout();
  else if(activeTab==="week")mc.innerHTML=renderWeek();
  else if(activeTab==="stats")mc.innerHTML=renderStats();
  else mc.innerHTML=renderCoach();

  const tabs=[{id:"today",label:"Today",icon:"💪"},{id:"week",label:"Week",icon:"📅"},{id:"stats",label:"Stats",icon:"📊"},{id:"coach",label:"Coach",icon:"🤖"}];
  document.getElementById("bottomNav").innerHTML=tabs.map(t=>`<button class="nav-btn" onclick="setTab('${t.id}')">
    <span style="font-size:20px">${t.icon}</span>
    <span style="font-size:9px;font-weight:${activeTab===t.id?700:500};color:${activeTab===t.id?t.id==="coach"?"var(--purple)":"var(--accent)":"var(--muted)"};letter-spacing:.04em">${t.label}</span>
    ${activeTab===t.id?`<div style="width:16px;height:2px;background:${t.id==="coach"?"var(--purple)":"var(--accent)"};border-radius:99px;margin-top:-2px"></div>`:""}
  </button>`).join("");
}
render();
</script>
</body>
</html>
