<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>THE SYSTEM — Hunter Protocol</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-title" content="System">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:#05060f;color:#dce8ff;overscroll-behavior:none;min-height:100vh}
:root{--bg:#05060f;--surface:#0a0e1e;--card:#0b1024;--card2:#111733;--border:#1c2c52;--border2:#2a4480;--faint:#16203f;--accent:#2bd4ff;--blue:#38bdf8;--green:#00e5b0;--purple:#a855f7;--red:#ff4d6d;--orange:#5fd0ff;--text:#dce8ff;--muted:#5f6f9c}
.sysfont{font-family:'Rajdhani','DM Sans',sans-serif}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(120% 60% at 50% -8%,rgba(43,212,255,.10),transparent 60%),var(--bg);padding-bottom:104px;position:relative}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(rgba(43,212,255,.025) 1px,transparent 1px);background-size:100% 3px;opacity:.5}
.top-bar{padding:16px 16px 0;position:sticky;top:0;z-index:10;background:rgba(5,6,15,.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(43,212,255,.12)}
.day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;padding:8px 12px;border-radius:14px;border:1.5px solid var(--border);background:transparent;cursor:pointer;text-align:center;min-width:54px;transition:all .25s cubic-bezier(.4,0,.2,1);font-family:inherit}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:20px;margin-bottom:10px;overflow:hidden;transition:border-color .3s,box-shadow .3s;position:relative}
.ex-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);pointer-events:none;z-index:1}
.ex-head{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.ex-body{border-top:1px solid var(--border);padding:14px 16px;background:rgba(0,0,0,.18)}
.set-bubble{width:38px;height:38px;border-radius:50%;border:2px solid var(--faint);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;font-family:inherit}
.set-bubble.done{border:none;background:var(--accent);color:#021018;transform:scale(1.12);box-shadow:0 0 14px rgba(43,212,255,.55),0 0 4px rgba(43,212,255,.4),0 2px 8px rgba(0,0,0,.3)}
.accordion{background:var(--card);border:1px solid var(--border);border-radius:18px;margin-bottom:10px;overflow:hidden}
.accordion-head{width:100%;padding:14px 16px;background:none;border:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--text);font-family:inherit}
.accordion-inner{border-top:1px solid var(--border);padding:10px 16px 14px;background:rgba(0,0,0,.15)}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:rgba(11,16,36,.92);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border2);border-radius:28px;display:flex;padding:7px 6px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 24px rgba(43,212,255,.1),inset 0 0 0 1px rgba(43,212,255,.05)}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:20px;font-family:inherit;transition:background .2s}
.add-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:199;display:none}
.add-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card2);border-radius:24px 24px 0 0;border-top:1px solid var(--border2);z-index:200;display:none;max-height:92vh;overflow-y:auto;padding-bottom:28px}
.form-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,212,255,.12)}
.stepper{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;height:48px}
.step-b{width:46px;height:100%;background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:background .15s}
.step-b:active{background:var(--faint)}
.step-v{flex:1;text-align:center;font-size:15px;font-weight:700;color:var(--text)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn{padding:12px 8px;border-radius:14px;border:1.5px solid var(--border);background:transparent;cursor:pointer;text-align:center;font-family:inherit;transition:all .2s;color:var(--text)}
.cat-btn.sel{border-color:var(--accent);background:rgba(43,212,255,.1);box-shadow:inset 0 0 0 1px rgba(43,212,255,.2),0 0 12px rgba(43,212,255,.15)}
.chevron{color:var(--muted);font-size:16px;transition:transform .25s cubic-bezier(.4,0,.2,1);display:inline-block;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}
.ring-wrap{position:relative;flex-shrink:0}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.step-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--faint);align-items:flex-start}
.step-row:last-child{border-bottom:none}
.step-num{width:20px;height:20px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
@keyframes tdot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tdot 1.4s infinite ease-in-out}
.tdot:nth-child(2){animation-delay:.16s}.tdot:nth-child(3){animation-delay:.32s}
button:active{opacity:.85}
/* ─── Solo Leveling "System" UI ─────────────────────────────── */
.ex-card{box-shadow:0 0 0 1px rgba(43,212,255,.04) inset,0 2px 14px rgba(0,0,0,.35)}
.accordion{box-shadow:0 0 0 1px rgba(43,212,255,.04) inset}
.sys-panel{position:relative;border:1px solid var(--border2)!important;background:linear-gradient(135deg,rgba(43,212,255,.07),rgba(43,212,255,.012))!important;box-shadow:0 0 0 1px rgba(43,212,255,.07) inset,0 0 26px rgba(43,212,255,.10)}
.cbr{position:absolute;width:13px;height:13px;border:2px solid var(--accent);pointer-events:none;opacity:.85;filter:drop-shadow(0 0 3px rgba(43,212,255,.7));z-index:2}
.cbr.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:7px 0 0 0}
.cbr.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 7px 0 0}
.cbr.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 7px}
.cbr.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 7px 0}
.rank-badge{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;line-height:1;min-width:26px;height:26px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid currentColor;box-shadow:0 0 12px -3px currentColor,inset 0 0 0 1px rgba(43,212,255,.05);letter-spacing:0;flex-shrink:0;text-align:center}
.exp-track{height:7px;border-radius:99px;background:rgba(43,212,255,.1);overflow:hidden;border:1px solid rgba(43,212,255,.18)}
.exp-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1d8fff,var(--accent));box-shadow:0 0 10px rgba(43,212,255,.6);transition:width .5s cubic-bezier(.4,0,.2,1)}
#sysToasts{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 12px 0;pointer-events:none}
.sys-toast{position:relative;width:100%;background:linear-gradient(135deg,rgba(11,16,36,.97),rgba(17,23,51,.97));border:1px solid var(--accent);border-radius:14px;padding:13px 16px 13px 18px;box-shadow:0 0 24px rgba(43,212,255,.35),0 8px 30px rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:toastIn .45s cubic-bezier(.2,1.25,.3,1) both;overflow:hidden}
.sys-toast::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.sys-toast.out{animation:toastOut .4s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-24px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-18px) scale(.96)}}
.st-tag{font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:.24em;color:var(--accent);font-weight:700;text-transform:uppercase}
.st-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:.03em;margin-top:1px;color:var(--text)}
.st-body{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.sys-toast.lvl{border-color:var(--purple);box-shadow:0 0 28px rgba(168,85,247,.45),0 8px 30px rgba(0,0,0,.55)}
.sys-toast.lvl::after{background:var(--purple);box-shadow:0 0 12px var(--purple)}
.sys-toast.lvl .st-tag{color:var(--purple)}
.sys-toast.lvl .cbr{border-color:var(--purple);filter:drop-shadow(0 0 3px rgba(168,85,247,.7))}
.glitch{font-family:'Rajdhani',sans-serif}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top-bar">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div><div class="sysfont" style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.28em">⟦ DAILY HUNTER PROTOCOL ⟧</div><div class="sysfont" style="font-size:25px;font-weight:700;letter-spacing:.06em;text-shadow:0 0 18px rgba(43,212,255,.45)">THE SYSTEM</div></div>
      <div id="dayBadge"></div>
    </div>
    <div id="playerHud" style="margin-bottom:12px"></div>
    <div class="day-strip" id="dayStrip"></div>
  </div>
  <div id="mainContent" style="padding:8px 16px 0"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>

<div id="sysToasts"></div>

<div class="add-overlay" id="addOverlay" onclick="closeAddSheet()"></div>
<div class="add-sheet" id="addSheet">
  <div style="display:flex;justify-content:center;padding:12px 0 6px"><div style="width:36px;height:4px;border-radius:99px;background:var(--faint)"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px 16px">
    <div class="sysfont" style="font-size:19px;font-weight:700;letter-spacing:.04em">⊹ REGISTER CUSTOM QUEST</div>
    <button onclick="closeAddSheet()" style="width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1">×</button>
  </div>
  <div style="padding:0 16px">
    <div style="margin-bottom:16px"><label class="form-label" for="exNameInput">EXERCISE NAME *</label><input class="form-input" id="exNameInput" type="text" inputmode="text" autocomplete="off" placeholder="e.g. Cable Crunch, Box Jump"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><div class="form-label">SETS</div><div class="stepper"><button class="step-b" onclick="adjSets(-1)">−</button><div class="step-v" id="setsVal">3</div><button class="step-b" onclick="adjSets(1)">+</button></div></div>
      <div><div class="form-label">REPS (0=TIMED)</div><div class="stepper"><button class="step-b" onclick="adjReps(-1)">−</button><div class="step-v" id="repsVal">10</div><button class="step-b" onclick="adjReps(1)">+</button></div></div>
    </div>
    <div style="margin-bottom:16px">
      <div class="form-label">CATEGORY (CALORIE ESTIMATE)</div>
      <div class="cat-grid">
        <button class="cat-btn" data-cat="heavy" onclick="selCat('heavy')"><div style="font-size:18px;margin-bottom:3px">🏋️</div><div style="font-size:11px;font-weight:700">Heavy Compound</div><div style="font-size:10px;color:var(--muted)">~13 kcal/set</div></button>
        <button class="cat-btn sel" data-cat="compound" onclick="selCat('compound')"><div style="font-size:18px;margin-bottom:3px">💪</div><div style="font-size:11px;font-weight:700">Compound</div><div style="font-size:10px;color:var(--muted)">~10 kcal/set</div></button>
        <button class="cat-btn" data-cat="isolation" onclick="selCat('isolation')"><div style="font-size:18px;margin-bottom:3px">🦾</div><div style="font-size:11px;font-weight:700">Isolation</div><div style="font-size:10px;color:var(--muted)">~6 kcal/set</div></button>
        <button class="cat-btn" data-cat="core" onclick="selCat('core')"><div style="font-size:18px;margin-bottom:3px">🧘</div><div style="font-size:11px;font-weight:700">Core / Mobility</div><div style="font-size:10px;color:var(--muted)">~5 kcal/set</div></button>
      </div>
    </div>
    <div style="margin-bottom:16px"><label class="form-label" for="exNoteInput">FORM NOTE (OPTIONAL)</label><input class="form-input" id="exNoteInput" type="text" inputmode="text" autocomplete="off" placeholder="e.g. RPE 8, slow eccentric"></div>
    <div style="margin-bottom:20px"><label class="form-label" for="exYtInput">YOUTUBE SEARCH (OPTIONAL)</label><input class="form-input" id="exYtInput" type="text" inputmode="text" autocomplete="off" placeholder="Leave blank to use exercise name"></div>
    <button onclick="submitNewEx()" class="sysfont" style="width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,#1d8fff,var(--accent));color:#021018;font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer;box-shadow:0 4px 22px rgba(43,212,255,.4)">＋ REGISTER QUEST</button>
  </div>
</div>

<script>

const CAL_CAT={heavy:13,compound:10,isolation:6,core:5,cardio:40};

let selectedDay=todayIdx,activeTab="today",openEx={},showWarmup=false,showCooldown=false;

// Progress + custom exercises: use localStorage on Vercel

// ─── Persistent Hunter progression (lifetime, never resets) ────────────────────
const EXP_MULT=10;
function dateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){const p=s.split("-").map(Number),d=new Date(p[0],p[1]-1,p[2]);return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function currentMonday(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return dateStr(d);}
function todayStr(){return dateStr(new Date());}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return dateStr(d);}
function blankPlayer(){return{exp:0,totalSets:0,gates:0,posture:0,streak:0,bestStreak:0,lastTrainDate:null,weekStart:currentMonday(),credited:{},attr:{push:0,pull:0,legs:0,recovery:0},log:[]};}
function seedFromCurrent(p){
  let live=0;
  DAYS.forEach(d=>{const dp=progressData[d.id]||{};let dExp=0;[...d.exercises,...(customExercises[d.id]||[])].forEach(e=>{(dp[e.id]?.sets||[]).forEach((v,i)=>{if(v){const val=(e.cal||7)*EXP_MULT;dExp+=val;p.totalSets++;if(e.posture)p.posture++;p.credited[d.id+":"+e.id+":"+i]=true;}});});p.attr[d.type]=(p.attr[d.type]||0)+dExp;live+=dExp;});
  p.exp=live;
  if(live>0){const t=todayStr();p.lastTrainDate=t;p.streak=1;p.bestStreak=1;p.log=[{date:t,exp:live,gates:[]}];}
}
let player=JSON.parse(localStorage.getItem("wt_player")||"null");
if(!player){player=blankPlayer();seedFromCurrent(player);saveStats();}

function saveStats(){localStorage.setItem("wt_player",JSON.stringify(player));}
function saveLS(){localStorage.setItem("wt_progress",JSON.stringify(progressData));localStorage.setItem("wt_custom",JSON.stringify(customExercises));saveStats();localTs=Date.now();localStorage.setItem("wt_ts",String(localTs));schedulePush();}

// ─── Cloud sync (single secret sync code → one save blob in Upstash Redis) ─────
let syncCode=localStorage.getItem("wt_synccode")||"";
let localTs=+(localStorage.getItem("wt_ts")||0);
let syncMsg="",_pushTimer=null;
function buildSave(){return{progress:progressData,custom:customExercises,player,ts:localTs};}
function renderIfStats(){if(activeTab==="stats")render();}
function setSyncCode(){const v=(document.getElementById("syncCodeInput")?.value||"").trim();syncCode=v;localStorage.setItem("wt_synccode",v);syncMsg=v?"Sync code set — Save/Load now available.":"Sync code cleared.";render();if(v)cloudPull(true);}
function schedulePush(){if(!syncCode)return;clearTimeout(_pushTimer);_pushTimer=setTimeout(()=>cloudPush(false),1500);}
async function cloudPush(manual){
  if(!syncCode){if(manual){syncMsg="Enter a sync code first.";renderIfStats();}return;}
  try{if(manual){syncMsg="Saving to cloud…";renderIfStats();}
    const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:syncCode,action:"push",save:buildSave()})});
    const d=await r.json();
    syncMsg=d.error==="sync_not_configured"?"Cloud sync isn't set up on the server yet.":d.ok?"✓ Synced "+new Date().toLocaleTimeString():"Sync failed: "+(d.error||"error");
  }catch(e){syncMsg="Sync error — offline?";}
  renderIfStats();
}
async function cloudPull(manual){
  if(!syncCode){if(manual){syncMsg="Enter a sync code first.";renderIfStats();}return;}
  try{if(manual){syncMsg="Loading from cloud…";renderIfStats();}
    const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:syncCode,action:"pull"})});
    const d=await r.json();
    if(d.error==="sync_not_configured"){syncMsg="Cloud sync isn't set up on the server yet.";renderIfStats();return;}
    if(d.ok&&d.save){const s=d.save;
      if(manual||(s.ts||0)>localTs){
        progressData=s.progress||{};customExercises=s.custom||{};if(s.player)player=s.player;
        localTs=s.ts||Date.now();localStorage.setItem("wt_ts",String(localTs));
        localStorage.setItem("wt_progress",JSON.stringify(progressData));localStorage.setItem("wt_custom",JSON.stringify(customExercises));saveStats();
        syncMsg="✓ Loaded cloud save"+(s.ts?" · "+new Date(s.ts).toLocaleString():"");render();return;
      }
      syncMsg="Local copy is already up to date.";
    }else if(d.ok){syncMsg="No cloud save yet — hit Save to create one.";}
    else{syncMsg="Pull failed: "+(d.error||"error");}
  }catch(e){syncMsg="Sync error — offline?";}
  renderIfStats();
}

// Weekly "gate respawn": a new week clears the checklist (logged weights kept); lifetime stats persist
function initWeek(){
  const wk=currentMonday();
  if(player.weekStart!==wk){
    Object.values(progressData).forEach(day=>Object.values(day).forEach(ex=>{if(ex&&Array.isArray(ex.sets))ex.sets=ex.sets.map(()=>false);}));
    player.credited={};player.weekStart=wk;saveLS();
  }
}
function logToday(expGain,gateLabel){
  const t=todayStr();let e=player.log.find(l=>l.date===t);
  if(!e){e={date:t,exp:0,gates:[]};player.log.unshift(e);if(player.log.length>90)player.log.pop();}
  if(expGain)e.exp+=expGain;
  if(gateLabel&&!e.gates.includes(gateLabel))e.gates.push(gateLabel);
}
function registerTrainingDay(expGain){
  const t=todayStr();
  if(player.lastTrainDate!==t){
    player.streak=(player.lastTrainDate===yesterdayStr())?player.streak+1:1;
    player.bestStreak=Math.max(player.bestStreak,player.streak);
    player.lastTrainDate=t;logToday(0,null);
    if(player.streak>1)notify("Streak Active",`🔥 ${player.streak}-DAY STREAK`,"Consecutive training days logged.");
  }
  logToday(expGain,null);
}
function awardSet(dayId,exId,idx){
  const key=dayId+":"+exId+":"+idx;
  if(player.credited[key])return;
  const ex=findEx(dayId,exId);if(!ex)return;
  const val=(ex.cal||7)*EXP_MULT;
  player.credited[key]=true;player.exp+=val;player.totalSets++;
  if(ex.posture)player.posture++;
  const t=DAYS[dayId]&&DAYS[dayId].type;if(t)player.attr[t]=(player.attr[t]||0)+val;
  registerTrainingDay(val);
}
function streakLive(){return(player.lastTrainDate===todayStr()||player.lastTrainDate===yesterdayStr())?player.streak:0;}
initWeek();
if(syncCode)cloudPull(false); // auto-pull newest save on load

// ─── Helpers ──────────────────────────────────────────────────────────────────
function getCalBurned(dayId){const day=DAYS[dayId];if(!day)return 0;const dp=progressData[dayId]||{};return[...day.exercises,...(customExercises[dayId]||[])].reduce((s,e)=>s+((dp[e.id]?.sets||[]).filter(Boolean).length)*(e.cal||7),0)}
function getMaxCal(dayId){const day=DAYS[dayId];if(!day)return 0;return[...day.exercises,...(customExercises[dayId]||[])].reduce((s,e)=>s+e.sets*(e.cal||7),0)}
function getWeekCal(){return DAYS.reduce((s,d)=>s+getCalBurned(d.id),0)}
function getDayProg(dayId){
  const day=DAYS[dayId];if(!day)return{done:0,total:0,pct:0};
  const allEx=[...day.exercises,...(customExercises[dayId]||[])];
  const dp=progressData[dayId]||{};
  const total=allEx.reduce((s,e)=>s+e.sets,0);
  const done=allEx.reduce((s,e)=>s+((dp[e.id]?.sets||[]).filter(Boolean).length),0);
  return{done,total,pct:total>0?Math.round((done/total)*100):0};
}
function ring(pct,size,stroke,color){
  const r=(size-stroke)/2,c=2*Math.PI*r,d=(pct/100)*c;
  return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1c2c52" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${d} ${c}" stroke-linecap="round"/></svg>`;
}
function corners(){return'<span class="cbr tl"></span><span class="cbr tr"></span><span class="cbr bl"></span><span class="cbr br"></span>';}
function cleanName(n){return n.replace(/★★\s?|★\s?|♦\s?/g,"");}

// ─── Progression: EXP · Level · Rank (Solo Leveling "System") ──────────────────
// Level/rank read lifetime EXP (player.exp), which only ever grows; per-set EXP is calorie×10.
const RANK_DEF=[{name:"E",color:"#8a93b3",min:1},{name:"D",color:"#00e5b0",min:4},{name:"C",color:"#38bdf8",min:8},{name:"B",color:"#2bd4ff",min:13},{name:"A",color:"#a855f7",min:19},{name:"S",color:"#ffd34d",min:26}];
function exEXP(ex,doneSets){return Math.round((doneSets!=null?doneSets:ex.sets)*(ex.cal||7)*EXP_MULT);}
function getTotalEXP(){return player.exp;}
function getLevelInfo(exp){let lvl=1,rem=exp,need=400;while(rem>=need){rem-=need;lvl++;need=400+(lvl-1)*300;}return{level:lvl,curXP:Math.round(rem),needXP:need,pct:Math.round(rem/need*100)};}
function getRank(level){let r=RANK_DEF[0];for(const x of RANK_DEF)if(level>=x.min)r=x;return r;}
function rankIndex(name){return RANK_DEF.findIndex(x=>x.name===name);}
function rankTitle(name){return({E:"Awakened",D:"Hunter",C:"Elite Hunter",B:"Ace Hunter",A:"National-Level",S:"Monarch"})[name]||"Hunter";}
function gateRank(dayId){const m=getMaxCal(dayId);return m<80?"E":m<140?"D":m<190?"C":m<240?"B":"A";}
function findEx(dayId,exId){return[...(DAYS[dayId]?.exercises||[]),...(customExercises[dayId]||[])].find(e=>e.id===exId);}

// ─── System Notifications ─────────────────────────────────────────────────────
function notify(tag,title,body,kind){
  const wrap=document.getElementById("sysToasts");if(!wrap)return;
  const el=document.createElement("div");
  el.className="sys-toast"+(kind==="lvl"?" lvl":"");
  el.innerHTML=corners()+`<div class="st-tag">▣ ${tag}</div><div class="st-title">${title}</div>`+(body?`<div class="st-body">${body}</div>`:"");
  wrap.appendChild(el);
  while(wrap.children.length>3)wrap.firstChild.remove();
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),440);},3400);
}
function checkProgression(beforeLvl,beforeRank){
  const lvl=getLevelInfo(getTotalEXP()).level,rank=getRank(lvl);
  if(lvl>beforeLvl)notify("Level Up",`LEVEL ${lvl}`,"Your power has increased.","lvl");
  if(rankIndex(rank.name)>rankIndex(beforeRank))notify("Notice",`RISEN TO ${rank.name}-RANK`,`You are now ${rankTitle(rank.name)}.`,"lvl");
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function toggleSet(dayId,exId,idx,totalSets){
  if(!progressData[dayId])progressData[dayId]={};
  if(!progressData[dayId][exId])progressData[dayId][exId]={sets:Array(totalSets).fill(false),weight:0};
  const s=progressData[dayId][exId].sets;while(s.length<totalSets)s.push(false);
  const wasExDone=s.filter(Boolean).length===totalSets;
  const wasDayDone=getDayProg(dayId).pct===100;
  const beforeLvl=getLevelInfo(getTotalEXP()).level,beforeRank=getRank(beforeLvl).name;
  const turningOn=!s[idx];
  s[idx]=turningOn;
  if(turningOn)awardSet(dayId,exId,idx);
  saveLS();render();
  const nowExDone=s.filter(Boolean).length===totalSets;
  if(!wasExDone&&nowExDone){const ex=findEx(dayId,exId);notify("Quest Complete","⟦ "+(ex?cleanName(ex.name):"QUEST")+" ⟧","+"+(ex?exEXP(ex):totalSets*70)+" EXP acquired");}
  if(!wasDayDone&&getDayProg(dayId).pct===100){
    const gk="gate:"+dayId;
    if(!player.credited[gk]){player.credited[gk]=true;player.gates++;logToday(0,DAYS[dayId].label);saveLS();}
    notify("Daily Quest Cleared","⟦ GATE CLEARED ⟧","All objectives cleared. Rewards acquired.");
  }
  checkProgression(beforeLvl,beforeRank);
}
function chgWeight(dayId,exId,d,totalSets){
  if(!progressData[dayId])progressData[dayId]={};
  if(!progressData[dayId][exId])progressData[dayId][exId]={sets:Array(totalSets).fill(false),weight:0};
  progressData[dayId][exId].weight=Math.max(0,(progressData[dayId][exId].weight||0)+d);saveLS();render();
}
function togEx(k){openEx[k]=!openEx[k];render()}
function togWarmup(){showWarmup=!showWarmup;render()}
function togCooldown(){showCooldown=!showCooldown;render()}
function selectDay(id){selectedDay=id;activeTab="today";render()}
function setTab(t){activeTab=t;render()}
function delCustomEx(dayId,exId){if(customExercises[dayId])customExercises[dayId]=customExercises[dayId].filter(e=>e.id!==exId);saveLS();render()}

function renderWorkout(){
  const day=DAYS[selectedDay],meta=TYPE[day.type],dp=progressData[day.id]||{};
  const{done,total,pct}=getDayProg(day.id),calDone=getCalBurned(day.id),calMax=getMaxCal(day.id);
  const expDone=calDone*EXP_MULT,gr=gateRank(day.id);
  const allEx=[...day.exercises,...(customExercises[day.id]||[])];
  let h=`<div class="sys-panel" style="border-radius:18px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden">${corners()}
    <div class="sysfont" style="font-size:10px;letter-spacing:.24em;color:var(--accent);font-weight:700;margin-bottom:10px">▣ DAILY QUEST${pct===100?` · <span style="color:var(--green)">⟦ GATE CLEARED ⟧</span>`:""}</div>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="ring-wrap">${ring(pct,64,5,meta.color)}<div class="ring-pct sysfont" style="font-size:14px;font-weight:700;color:${meta.color}">${pct}%</div></div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span>${meta.emoji}</span><span class="sysfont" style="font-size:19px;font-weight:700;letter-spacing:.03em">GATE: ${day.label}</span><span class="rank-badge" style="color:${TYPE[day.type]?meta.color:meta.color};font-size:11px;min-width:0;height:20px;padding:0 7px">${gr}-RANK</span></div>
        <div style="font-size:12px;color:var(--muted)">${day.focus}</div>
        <div class="sysfont" style="font-size:12px;color:${meta.color};margin-top:4px;font-weight:600;letter-spacing:.05em">${done}/${total} OBJECTIVES · ${pct}%</div>
      </div>
      <div style="text-align:center;background:rgba(43,212,255,.08);border:1px solid rgba(43,212,255,.25);border-radius:14px;padding:10px 12px;flex-shrink:0;min-width:72px;box-shadow:0 0 14px rgba(43,212,255,.1) inset">
        <div style="font-size:15px">⚡</div><div class="sysfont" style="font-size:21px;font-weight:700;color:var(--accent);line-height:1.1;margin-top:2px">${expDone}</div>
        <div class="sysfont" style="font-size:8px;color:var(--muted);font-weight:700;letter-spacing:.12em;margin-top:2px">EXP</div>
        <div style="font-size:9px;color:var(--faint)">/ ${calMax*EXP_MULT}</div>
      </div>
    </div>
  </div>`;
  h+=`<div class="accordion"><button class="accordion-head" onclick="togWarmup()"><div style="display:flex;gap:8px;align-items:center"><span>⚡</span><span class="sysfont" style="font-size:14px;font-weight:700;letter-spacing:.06em">PREPARATION PHASE</span></div><span class="chevron${showWarmup?" open":""}">▾</span></button>`;
  if(showWarmup)h+=`<div class="accordion-inner">${WARMUP.map((w,i)=>`<div class="step-row"><span class="step-num" style="background:rgba(43,212,255,.18);color:var(--accent)">${i+1}</span><span style="font-size:12px;color:var(--muted);line-height:1.5">${w}</span></div>`).join("")}</div>`;
  h+="</div>";
  h+=renderExList(day.id,allEx,dp,meta.color);
  h+=`<button onclick="openAddSheet()" class="sysfont" style="width:100%;padding:14px;border-radius:16px;border:1.5px dashed rgba(43,212,255,.4);background:rgba(43,212,255,.05);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;letter-spacing:.08em;transition:all .2s">＋ REGISTER CUSTOM QUEST</button>`;
  h+=`<div class="accordion"><button class="accordion-head" onclick="togCooldown()"><div style="display:flex;gap:8px;align-items:center"><span>🌙</span><span class="sysfont" style="font-size:14px;font-weight:700;letter-spacing:.06em">RECOVERY PHASE</span></div><span class="chevron${showCooldown?" open":""}">▾</span></button>`;
  if(showCooldown)h+=`<div class="accordion-inner">${COOLDOWN.map((w,i)=>`<div class="step-row"><span class="step-num" style="background:rgba(56,189,248,.18);color:var(--blue)">${i+1}</span><span style="font-size:12px;color:var(--muted);line-height:1.5">${w}</span></div>`).join("")}</div>`;
  return h+"</div>";}

function renderWeek(){
  const wc=getWeekCal();
  let h=`<div style="padding:0 16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 class="sysfont" style="font-size:21px;font-weight:700;letter-spacing:.04em">⟦ GATES OVERVIEW ⟧</h2><div style="text-align:right"><div class="sysfont" style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.14em">WEEKLY EXP</div><div class="sysfont" style="font-size:20px;font-weight:700;color:var(--accent)">⚡ ${wc*EXP_MULT}</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">`;
  DAYS.forEach(d=>{const m=TYPE[d.type],{pct}=getDayProg(d.id),cal=getCalBurned(d.id);const isSel=d.id===selectedDay,isTdy=d.id===todayIdx;
    h+=`<button class="day-btn" onclick="selectDay(${d.id})" style="border-color:${isSel?m.color:isTdy?m.color+"55":"var(--border)"};background:${isSel?m.color+"18":"transparent"};padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="font-size:11px;color:${isSel?m.color:"var(--muted)"};font-weight:600">${d.day}</div><div style="font-size:18px">${m.emoji}</div>
      <div style="font-size:10px;color:${m.color};font-weight:700">${d.label}</div>
      <div style="width:100%;height:4px;border-radius:99px;background:var(--faint);overflow:hidden"><div style="height:100%;width:${pct}%;background:${m.color};border-radius:99px"></div></div>
      <div style="font-size:9px;color:var(--muted)">${cal?"⚡"+cal*EXP_MULT:"—"}</div>
    </button>`;});
  h+=`</div><div class="sys-panel" style="border-radius:18px;padding:16px;margin-bottom:12px;position:relative">${corners()}<div class="sysfont" style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.16em;margin-bottom:12px">▣ EXP ACQUISITION LOG</div>`;
  DAYS.forEach(d=>{const m=TYPE[d.type],calDone=getCalBurned(d.id),calMax=getMaxCal(d.id),pf=calMax>0?Math.round((calDone/calMax)*100):0;
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:26px;font-size:11px;color:var(--muted);font-weight:600">${d.day}</div><div style="font-size:10px;color:${m.color};width:46px;font-weight:700;flex-shrink:0">${d.label}</div>
      <div style="flex:1;height:8px;border-radius:99px;background:var(--faint);overflow:hidden"><div style="height:100%;width:${pf}%;background:linear-gradient(90deg,${m.color},var(--accent));border-radius:99px;transition:width .6s;box-shadow:0 0 8px rgba(43,212,255,.4)"></div></div>
      <div class="sysfont" style="font-size:11px;font-weight:600;min-width:64px;text-align:right;color:${calDone?"var(--accent)":"var(--faint)"}">${calDone?"⚡ "+calDone*EXP_MULT:"0 EXP"}</div>
    </div>`;});
  return h+`</div></div>`;
}

  </div>`;
  h+=`<div class="sys-panel" style="border-radius:18px;padding:16px;position:relative">${corners()}<div class="sysfont" style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.16em;margin-bottom:12px">▣ NUTRITION PROTOCOL</div>`;
  [{l:"Calories",v:"2,600 kcal",c:"var(--accent)"},{l:"Protein",v:"140 g · 2.19 g/kg",c:"var(--blue)"},{l:"Carbs",v:"348 g",c:"var(--green)"},{l:"Fat",v:"72 g",c:"var(--purple)"}].forEach(m=>{h+=`<div class="info-row"><span style="font-size:13px;color:var(--muted)">${m.l}</span><span style="font-size:13px;font-weight:700;color:${m.c}">${m.v}</span></div>`;});
  return h+`<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6">Last meal by 7:30 PM · No food 3h before sleep</div></div></div>`;}

function renderCoach(){
  const day=DAYS[selectedDay];
  const chips=["Analyze today's gate","Can't do pull-ups — give me a substitute","Pre-quest fuel (no citrus)","I'm fatigued — should I still raid?","Best posture drill for today","High-protein meal to recover HP"];
  let h=`<div style="padding:0 16px">
    <div class="sys-panel" style="border-color:rgba(168,85,247,.4)!important;background:linear-gradient(135deg,rgba(168,85,247,.14),rgba(168,85,247,.03))!important;box-shadow:0 0 0 1px rgba(168,85,247,.1) inset,0 0 26px rgba(168,85,247,.14)!important;border-radius:18px;padding:16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden">
      <span class="cbr tl" style="border-color:var(--purple)"></span><span class="cbr tr" style="border-color:var(--purple)"></span><span class="cbr bl" style="border-color:var(--purple)"></span><span class="cbr br" style="border-color:var(--purple)"></span>
      <div class="sysfont" style="width:46px;height:46px;border-radius:14px;background:rgba(168,85,247,.2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:var(--purple);box-shadow:0 0 16px rgba(168,85,247,.4),0 0 0 1px rgba(168,85,247,.4) inset">◈</div>
      <div>
        <div class="sysfont" style="font-size:18px;font-weight:700;letter-spacing:.05em;text-shadow:0 0 14px rgba(168,85,247,.4)">THE SYSTEM</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">Your Shadow · ${day.label}</div>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <div class="sysfont" style="font-size:11px;color:var(--purple);font-weight:700;letter-spacing:.16em;margin-bottom:8px">▣ SYSTEM QUERIES</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none">
        ${chips.map(c=>`<button data-msg="${c}" onclick="sendChat(this.dataset.msg)" style="flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border2);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s">${c}</button>`).join("")}
      </div>
    </div>`;

  if(chatMsgs.length===0){
    h+=`<div style="text-align:center;padding:44px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px;color:var(--purple);text-shadow:0 0 18px rgba(168,85,247,.5)">◈</div><div class="sysfont" style="font-size:16px;font-weight:700;color:var(--text);letter-spacing:.04em">THE SYSTEM AWAITS YOUR QUERY</div><div style="font-size:12px;margin-top:8px;line-height:1.7;color:var(--muted)">Form cues · Quest subs · Nutrition<br>Recovery · Posture · Meal ideas</div></div>`;
  } else {
    h+=`<div style="margin-bottom:14px">`;
    chatMsgs.forEach(m=>{
      const isUser=m.role==="user";
      h+=`<div style="display:flex;${isUser?"justify-content:flex-end":"justify-content:flex-start"};margin-bottom:12px;gap:8px;align-items:flex-end">
        ${!isUser?`<div class="sysfont" style="width:28px;height:28px;border-radius:50%;background:rgba(168,85,247,.2);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;margin-bottom:2px">◈</div>`:""}
        <div style="max-width:80%;background:${isUser?"rgba(43,212,255,.16)":"var(--card)"};border:1px solid ${isUser?"rgba(43,212,255,.3)":"var(--border)"};border-radius:${isUser?"16px 4px 16px 16px":"4px 16px 16px 16px"};padding:11px 14px;font-size:13px;color:var(--text);line-height:1.65">${m.content.replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>")}</div>
        ${isUser?`<div style="width:28px;height:28px;border-radius:50%;background:rgba(43,212,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;margin-bottom:2px">⚔️</div>`:""}
      </div>`;
    });
    if(chatBusy){
      h+=`<div style="display:flex;justify-content:flex-start;gap:8px;align-items:flex-end;margin-bottom:12px">
        <div class="sysfont" style="width:28px;height:28px;border-radius:50%;background:rgba(168,85,247,.2);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px">◈</div>
        <div style="background:var(--card);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:14px 16px;display:flex;gap:5px;align-items:center">
          <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
        </div>
      </div>`;
    }
    h+=`</div><button onclick="clearChat()" class="sysfont" style="width:100%;padding:9px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;letter-spacing:.08em;cursor:pointer;margin-bottom:12px">⟲ RESET LOG</button>`;
  }
  h+=`<div style="display:flex;gap:8px">
    <input id="ci" type="text" placeholder="Query the System..." onkeypress="if(event.key==='Enter')sendChatInput()" style="flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none" onfocus="this.style.borderColor='var(--purple)'" onblur="this.style.borderColor='var(--border)'">
    <button onclick="sendChatInput()" ${chatBusy?"disabled":""} style="width:46px;height:46px;border-radius:12px;border:none;background:${chatBusy?"var(--faint)":"var(--purple)"};color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:background .2s">↑</button>
  </div></div>`;
  return h;
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render(){
  const day=DAYS[selectedDay],meta=TYPE[day.type];
  const badge=document.getElementById("dayBadge");
  badge.style.cssText=`background:${meta.color}18;border:1px solid ${meta.color}3A;border-radius:16px;padding:8px 14px;text-align:center`;
  badge.innerHTML=`<div style="font-size:20px;line-height:1">${meta.emoji}</div><div style="font-size:9px;color:${meta.color};font-weight:700;margin-top:3px;letter-spacing:.06em">${day.day.toUpperCase()}</div>`;

  const lv=getLevelInfo(getTotalEXP()),rk=getRank(lv.level),hud=document.getElementById("playerHud");
  if(hud)hud.innerHTML=`<div class="sys-panel" style="border-radius:14px;padding:10px 12px;position:relative;display:flex;align-items:center;gap:11px">${corners()}
    <span class="rank-badge" style="color:${rk.color}">${rk.name}</span>
    <div style="flex:1;min-width:0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
        <span class="sysfont" style="font-size:13px;font-weight:700;letter-spacing:.08em">LV ${lv.level} · ${rankTitle(rk.name).toUpperCase()}</span>
        <span class="sysfont" style="font-size:10px;color:var(--accent)">⚡ ${lv.curXP}/${lv.needXP}</span>
      </div>
      <div class="exp-track"><div class="exp-fill" style="width:${lv.pct}%"></div></div>
    </div>
  </div>`;

  document.getElementById("dayStrip").innerHTML=DAYS.map(d=>{
    const m=TYPE[d.type],isSel=d.id===selectedDay,isTdy=d.id===todayIdx;
    return`<button class="day-btn" onclick="selectDay(${d.id})" style="border-color:${isSel?m.color:isTdy?m.color+"44":"var(--border)"};background:${isSel?m.color+"22":"transparent"}${isSel?";box-shadow:0 0 14px "+m.color+"33":""}">
      <div class="sysfont" style="font-size:11px;font-weight:700;letter-spacing:.04em;color:${isSel?m.color:isTdy?m.color:"var(--muted)"}">${d.day}</div>
      <div style="font-size:8px;color:${isSel?m.color:"var(--faint)"};margin-top:2px;font-weight:600">${d.label}</div>
    </button>`;}).join("");

  const mc=document.getElementById("mainContent");
  const pad=activeTab==="today"?"8px 16px 0":"8px 0 0";
  mc.style.padding=pad;
  if(activeTab==="today")mc.innerHTML=renderWorkout();
  else if(activeTab==="week")mc.innerHTML=renderWeek();
  else if(activeTab==="stats")mc.innerHTML=renderStats();
  else mc.innerHTML=renderCoach();

  const tabs=[{id:"today",label:"QUEST",icon:"⚔️"},{id:"week",label:"GATES",icon:"🌀"},{id:"stats",label:"STATUS",icon:"👤"},{id:"coach",label:"SYSTEM",icon:"◈"}];
  document.getElementById("bottomNav").innerHTML=tabs.map(t=>{
    const isA=activeTab===t.id,col=t.id==="coach"?"var(--purple)":"var(--accent)",bg=t.id==="coach"?"rgba(168,85,247,.14)":"rgba(43,212,255,.12)";
    return`<button class="nav-btn" onclick="setTab('${t.id}')" style="${isA?`background:${bg};box-shadow:0 0 16px ${t.id==="coach"?"rgba(168,85,247,.22)":"rgba(43,212,255,.2)"} inset`:""}">
      <span style="font-size:20px;color:${isA?col:"var(--muted)"}">${t.icon}</span>
      <span class="sysfont" style="font-size:9px;font-weight:${isA?700:600};color:${isA?col:"var(--muted)"};letter-spacing:.12em">${t.label}</span>
    </button>`;
  }).join("");
}
render();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
